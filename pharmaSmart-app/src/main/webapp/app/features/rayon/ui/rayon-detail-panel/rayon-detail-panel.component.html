<div class="detail-panel">
  <!-- Header -->
  <div class="panel-header">
    <div class="panel-title-block">
      <div class="panel-libelle">{{ rayon().libelle }}</div>
      <div class="panel-meta">
        <span class="pharma-code">{{ rayon().code }}</span>
        @if (rayon().typeZone) {
          <app-badge [label]="rayon().typeZone!" [severity]="typeZoneSev(rayon().typeZone)" />
        }
        <span class="text-muted" style="font-size:.75rem">{{ rayon().storageType }}</span>
        @if (rayon().position) {
          <span class="text-muted" style="font-size:.75rem">· {{ rayon().position }}</span>
        }
      </div>
    </div>
    <div class="panel-actions">
      <app-button
        icon="pi pi-list-check"
        label="Inventaire"
        size="small"
        severity="info"
        [outlined]="true"
        ngbTooltip="Lancer un inventaire pour ce rayon"
        placement="bottom"
        (clicked)="onLancerInventaire()"
      />
      @if (rayon().code !== 'SANS') {
      <app-button
        icon="pi pi-copy"
        label="Cloner vers..."
        size="small"
        severity="info"
        [outlined]="true"
        ngbTooltip="Cloner les produits de ce rayon vers d'autres stockages"
        placement="bottom"
        (clicked)="onClonerVers()"
      />
      <app-button
        icon="pi pi-pencil"
        label="Modifier"
        size="small"
        severity="primary"
        [outlined]="true"
        (clicked)="onEdit()"
      />

        <app-button
          icon="pi pi-trash"
          [text]="true"
          size="small"
          severity="danger"
          ngbTooltip="Supprimer"
          (clicked)="onDelete()"
        />
      }
      <app-button
        icon="pi pi-times"
        [text]="true"
        size="small"
        severity="secondary"
        ngbTooltip="Fermer"
        placement="left"
        (clicked)="closed.emit()"
      />
    </div>
  </div>

  <!-- Onglets ngbNav -->
  <app-nav-tabs [nav]="nav" containerClass="flex-1-overflow">
    <div
      #nav="ngbNav"
      [activeId]="activeTab()"
      (activeIdChange)="onTabChange($event)"
      class="nav pharma-nav-tabs"
      ngbNav
    >
      <ng-container ngbNavItem="produits">
        <a class="pharma-nav-tab-link" ngbNavLink>
          <i class="pi pi-box"></i>
          <span>Produits</span>
        </a>
        <ng-template ngbNavContent>
          <app-rayon-produits-tab [rayon]="rayon()" />
        </ng-template>
      </ng-container>

      <ng-container ngbNavItem="parametres">
        <a class="pharma-nav-tab-link" ngbNavLink>
          <i class="pi pi-cog"></i>
          <span>Paramètres</span>
        </a>
        <ng-template ngbNavContent>
          <app-detail-grid>
            <app-detail-section header="Paramètres du rayon" icon="pi pi-cog" [accent]="'slate'"
                                [width]="'wide'" storageKey="rayon.detail.parametres">
              <app-detail-field label="Emplacement" [value]="rayon().storageLibelle ?? rayon().storageType" />
              <app-detail-field label="Code" [value]="rayon().code" />
              <app-detail-field label="Type de zone">
                @if (rayon().typeZone) {
                  <app-badge [label]="rayon().typeZone!" [severity]="typeZoneSev(rayon().typeZone)" />
                } @else {
                  <span class="text-muted">—</span>
                }
              </app-detail-field>
              <app-detail-field label="Position" [value]="rayon().position" />
              <app-detail-field label="Exclure" [value]="rayon().exclude ? 'Oui' : 'Non'" />
            </app-detail-section>
          </app-detail-grid>
        </ng-template>
      </ng-container>
    </div>
  </app-nav-tabs>
</div>
