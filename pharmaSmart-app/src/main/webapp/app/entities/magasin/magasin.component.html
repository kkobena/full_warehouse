<div class="pharma-smart-content">
  @if (magasin(); as m) {
    <app-toolbar [compact]="true" [subtitle]="m.typeLibelle || ''" [title]="m.fullName || 'Informations du Magasin'" icon="pi pi-building">
      <ng-container ngProjectAs="[toolbarActions]">
        <app-button [routerLink]="['/magasin', m.id, 'edit']" icon="pi pi-pencil" label="Modifier" severity="primary" />
      </ng-container>
    </app-toolbar>

    <div class="magasin-grid">
      <app-card header="Informations Générales" icon="pi pi-info-circle">
        <app-detail-field label="Nom complet" [value]="m.fullName" />
        <app-detail-field label="Nom abrégé" [value]="m.name" />
        <app-detail-field label="Type de magasin">
          <app-badge [label]="m.typeLibelle || m.typeMagasin" severity="info" />
        </app-detail-field>
      </app-card>

      <app-card header="Informations de Contact" icon="pi pi-phone">
        <app-detail-field label="Téléphone">
          @if (m.phone) {
            <a [href]="'tel:' + m.phone">{{ m.phone }}</a>
          } @else {
            —
          }
        </app-detail-field>
        <app-detail-field label="Email">
          @if (m.email) {
            <a [href]="'mailto:' + m.email">{{ m.email }}</a>
          } @else {
            —
          }
        </app-detail-field>
        <app-detail-field label="Adresse" [value]="m.address" />
      </app-card>

      <app-card header="Informations Administratives" icon="pi pi-file-edit">
        <app-detail-field label="Registre de commerce" [value]="m.registre" />
        <app-detail-field label="Compte contribuable" [value]="m.compteContribuable" />
        <app-detail-field label="Numéro comptable" [value]="m.numComptable" />
        <app-detail-field label="Compte bancaire" [value]="m.compteBancaire" />
        <app-detail-field label="Registre d'imposition" [value]="m.registreImposition" />
        <app-detail-field label="FNE point de vente" [value]="m.fnePointOfSale" />
        <app-detail-field label="FNE clé secrète" [value]="m.fneSecretKey ? '••••••••' : null" />
      </app-card>

      <app-card header="Messages et Notes" icon="pi pi-comment">
        <div class="magasin-texte">
          <span class="magasin-texte-label">Message de bienvenue</span>
          <p>{{ m.welcomeMessage || '—' }}</p>
        </div>
        <div class="magasin-texte">
          <span class="magasin-texte-label">Notes</span>
          <p>{{ m.note || '—' }}</p>
        </div>
      </app-card>
    </div>
  }
</div>
