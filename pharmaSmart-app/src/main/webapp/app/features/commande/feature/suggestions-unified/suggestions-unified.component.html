<div class="pharma-smart-content">
  <div class="pharma-toolbar su-parent-toolbar">

    <!-- Header bleu : titre + indicateur fraîcheur + bouton config -->
    <div class="pharma-toolbar-header">
      <i class="pi pi-lightbulb"></i>
      <span class="su-title">Gestion des approvisionnements</span>

      <div class="su-header-end ms-auto">
        @if (semoisFraicheur()) {
          <app-badge
            [label]="semoisFraicheurLabel"
            [severity]="semoisFraicheurSeverity"
            icon="pi pi-clock"
            ngbTooltip="Fraîcheur du calcul VMM (Vente Mensuelle Moyenne). Mise à jour automatique quotidienne selon le planning configuré."
            placement="bottom"
          />
        }
        <div class="su-config-btn-wrap">
          <app-button
            (clicked)="ouvrirConfigCriticite()"
            [outlined]="false"
            [severity]="'primary'"
            icon="pi pi-sliders-h"
            label="Classes produits"
            ngbTooltip="Paramétrage des classes A/B/C/D et des règles de réapprovisionnement automatique par classe"
            placement="bottom"
            size="small"
          />
        </div>
      </div>
    </div>

    <app-subtab-bar
      ariaLabel="Sources d'approvisionnement"
      [tabs]="onglets()"
      [active]="activeSource()"
      (activeChange)="setSource($any($event))"
    />
  </div>

  <!-- ─── Contenu selon la source active ──────────────────────────────── -->
  @if (activeSource() === 'REAPPRO') {
    <app-suggestion-home />
  } @else if (activeSource() === 'COMMANDES_A_PASSER') {
    <app-commande-requested-home (countChange)="countCommandesAPasser.set($event)" />
  } @else if (activeSource() === 'BONS_DE_LIVRAISON') {
    <app-list-bons />
  } @else {
    <app-semois-suggestions />
  }
</div>
