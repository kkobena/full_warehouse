import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
  id 'com.android.application'
  id 'com.google.devtools.ksp'
  id 'org.jetbrains.kotlin.plugin.parcelize'
}

android {
  namespace = 'com.kobe.warehouse.inventory'
  compileSdk = 37

  defaultConfig {
    applicationId = 'com.kobe.warehouse.inventory'
    minSdk = 30
    targetSdk = 36
    versionCode = 1
    versionName = "1.0.0"

    testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    buildConfigField "String", "BASE_URL", "\"http://10.0.2.2:9080/\""
    buildConfigField "String", "AUTH_ENDPOINT", "\"/api/auth/login\""
    buildConfigField "String", "ACCOUNT_ENDPOINT", "\"/api/account\""
  }

  buildTypes {
    release {
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    debug {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  kotlin {
    compilerOptions {
      jvmTarget = JvmTarget.JVM_17
    }
  }

  buildFeatures {
    viewBinding = true
    dataBinding = true
    buildConfig = true
  }
  ndkVersion '26.3.11579264'
}
base {
  archivesName.set("pharma-smart-inventory-${android.defaultConfig.versionName}")
}

dependencies {
  // Core Android dependencies
  implementation 'androidx.core:core-ktx:1.19.0'
  implementation 'androidx.appcompat:appcompat:1.7.1'
  implementation 'com.google.android.material:material:1.14.0'
  implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
  implementation 'androidx.activity:activity-ktx:1.13.0'
  implementation 'androidx.fragment:fragment-ktx:1.9.0'

  // Lifecycle components
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
  implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'

  // Coroutines
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

  // Retrofit for networking
  implementation 'com.squareup.retrofit2:retrofit:3.0.0'
  implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
  implementation 'com.squareup.okhttp3:okhttp:5.4.0'
  implementation 'com.squareup.okhttp3:logging-interceptor:5.4.0'

  // Gson for JSON parsing
  implementation 'com.google.code.gson:gson:2.14.0'

  // RecyclerView & SwipeRefreshLayout
  implementation 'androidx.recyclerview:recyclerview:1.4.0'
  implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'

  // SharedPreferences - Encrypted (for secure token storage)
  implementation 'androidx.security:security-crypto:1.1.0'

  // LocalBroadcastManager for session event broadcasting
  implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

  // Room Database for offline caching
  implementation 'androidx.room:room-runtime:2.8.4'
  implementation 'androidx.room:room-ktx:2.8.4'
  ksp 'androidx.room:room-compiler:2.8.4'

  // Splash Screen API
  implementation 'androidx.core:core-splashscreen:1.2.0'

  // Scan de codes-barres : ML Kit (modèle embarqué, aucun téléchargement Play
  // Services à l'exécution — l'appli doit fonctionner sur un réseau isolé) +
  // CameraX pour le flux d'images
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'
  implementation 'androidx.camera:camera-core:1.6.1'
  implementation 'androidx.camera:camera-camera2:1.6.1'
  implementation 'androidx.camera:camera-lifecycle:1.6.1'
  implementation 'androidx.camera:camera-view:1.6.1'

  // Image loading library (Coil for Kotlin)
  implementation 'io.coil-kt:coil:2.7.0'

  // Paging 3 for pagination
  implementation 'androidx.paging:paging-runtime-ktx:3.5.0'

  // Navigation component
  implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
  implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'

  // ViewPager2 for responsive layouts
  implementation 'androidx.viewpager2:viewpager2:1.1.0'

  // Card View
  implementation 'androidx.cardview:cardview:1.0.0'

  // Work Manager for background sync
  implementation 'androidx.work:work-runtime-ktx:2.11.2'

  // Testing
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
