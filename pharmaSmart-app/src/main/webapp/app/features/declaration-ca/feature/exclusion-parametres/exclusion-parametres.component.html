<h5 class="mb-1">Unités gratuites</h5>


<div class="form-check form-switch mb-3">
  <input class="form-check-input" type="checkbox" role="switch" id="exclude-free-unit"
         [checked]="excludeFreeUnit()" [disabled]="chargement()"
         (change)="enregistrer($any($event.target).checked)" />
  <label class="form-check-label" for="exclude-free-unit">
    Exclure les unités gratuites du chiffre d'affaires à déclarer
  </label>
</div>

<p class="text-muted small mb-0">
  <i class="pi pi-info-circle me-1"></i>
  Le changement ne s'applique qu'aux ventes à venir.
</p>
