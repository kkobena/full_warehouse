<app-kpi-strip [loading]="loading()" [skeletonCount]="4">
  @if (kpi(); as k) {
    <app-kpi-item [accent]="'primary'" icon="pi pi-file-edit" iconClass="text-primary"
                  label="Total facturé" [value]="k.totalFacture | number" valueClass="text-primary">
      <ng-container ngProjectAs="[kpiSub]">{{ k.countFactures | number }} factures</ng-container>
    </app-kpi-item>

    <app-kpi-item [accent]="'success'" icon="pi pi-check-circle" iconClass="text-success"
                  label="Montant réglé" [value]="k.totalRegle | number" valueClass="text-success">
      <ng-container ngProjectAs="[kpiSub]">Taux {{ k.tauxRecouvrement | number: '1.1-1' }} %</ng-container>
    </app-kpi-item>

    <app-kpi-item [accent]="'danger'" icon="pi pi-exclamation-circle" iconClass="text-danger"
                  label="Restant dû" [value]="k.totalRestant | number" valueClass="text-danger">
      <ng-container ngProjectAs="[kpiSub]">{{ k.countImpayees | number }} impayées</ng-container>
    </app-kpi-item>

    <app-kpi-item [accent]="'warning'" icon="pi pi-clock" iconClass="text-warning"
                  label="En retard" [value]="k.countEnRetard | number" valueClass="text-warning">
      <ng-container ngProjectAs="[kpiSub]">Délai dépassé</ng-container>
    </app-kpi-item>
  } @else {
    <!--
      Sans cette branche, un KPI absent ne rendait AUCUN élément : l'écran était strictement
      identique à celui d'un appel qui n'aurait jamais été lancé. Le lecteur — et celui qui
      diagnostique — ne pouvait pas distinguer les deux.
    -->
    <app-kpi-item icon="pi pi-info-circle" iconClass="text-muted" label="Indicateurs"
                  value="Indisponibles" valueClass="text-muted">
      <ng-container ngProjectAs="[kpiSub]">Aucune donnée sur la période sélectionnée</ng-container>
    </app-kpi-item>
  }
</app-kpi-strip>
