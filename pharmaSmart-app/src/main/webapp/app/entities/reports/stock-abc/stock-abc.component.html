<!--
  `app-toolbar` et non un `<div class="pharma-toolbar">` recopié : les emplacements
  `ngProjectAs="[toolbarFilters]"` et `[toolbarActions]` ne projettent QUE dans un composant
  qui les déclare. Posés dans un div ordinaire, ils étaient inertes — filtres et actions se
  rendaient à la suite, hors de la structure attendue — et le titre restait un `<span>`, donc
  invisible pour la navigation par en-têtes.

  Le titre et l'icône suivent l'onglet actif : la barre nomme ce qu'on regarde.
-->
<app-toolbar [icon]="active() === 'pareto' ? 'pi pi-chart-pie' : 'pi pi-sync'"
             [title]="active() === 'pareto' ? 'Analyse ABC Pareto (5 classes)' : 'Rotation du Stock (Analyse ABC)'">
  <ng-container ngProjectAs="[toolbarFilters]">
      @if (active() === 'pareto') {
        <app-select
          (ngModelChange)="onParetoFamilleChange($event)"
          [clearable]="true"
          [items]="paretoComp?.familleOptions() ?? []"
          [ngModel]="paretoComp?.selectedFamille()"
          [style]="{ 'min-width': '300px' }"
          appendTo="body"
          bindLabel="label"
          bindValue="value"
          inputId="abcFamille"

          placeholder="Famille"
        />
        <app-select
          (ngModelChange)="onParetoClasseChange($event)"
          [clearable]="true"
          [items]="paretoComp?.classeParetoOptions() ?? []"
          [ngModel]="paretoComp?.selectedClassePareto()"
          [style]="{ 'width': '220px' }"
          appendTo="body"
          bindLabel="label"
          bindValue="value"
          inputId="abcClasse"
          placeholder="Classe Pareto"
          size="large"
        />
      }
      @if (active() === 'rotation') {
        <app-select
          (ngModelChange)="onRotationCategorieChange($event)"
          [clearable]="true"
          [disabled]="rotationComp?.showSlowMovingOnly() ?? false"
          [items]="rotationComp?.categorieOptions() ?? []"
          [ngModel]="rotationComp?.selectedCategorie()"
          appendTo="body"
          bindLabel="label"
          bindValue="value"
          inputId="rotCategorie"
          placeholder="Catégorie"
          size="large"
        />
        <app-select
          (ngModelChange)="onRotationABCChange($event)"
          [clearable]="true"
          [disabled]="rotationComp?.showSlowMovingOnly() ?? false"
          [items]="rotationComp?.abcOptions ?? []"
          [ngModel]="rotationComp?.selectedABC()"
          appendTo="body"
          bindLabel="label"
          bindValue="value"
          inputId="rotClassification"
          placeholder="Classification ABC"
          size="large"
        />
      }
  </ng-container>

  <ng-container ngProjectAs="[toolbarActions]">
    @if (active() === 'pareto') {
      <div class="flex gap-2">
        <app-button (clicked)="paretoComp?.toggleHelpDrawer()" [outlined]="true"
                    icon="pi pi-question-circle" label="Aide" severity="secondary" size="small" />
        <app-button (clicked)="paretoComp?.showTopContributors()"
                    icon="pi pi-star" label="Top 50 Contributeurs" severity="info" size="small" />
        <!--
          L'onglet Rotation offrait son export PDF, pas celui-ci — alors que `exportToPdf()`
          existe des deux côtés. Le classement ABC est pourtant le document qu'on emporte en
          réunion d'achat : c'est lui qui dit quelles références méritent qu'on s'en occupe.
        -->
        <app-button (clicked)="paretoComp?.exportToPdf()"
                    icon="pi pi-file-pdf" label="Exporter PDF" severity="danger" size="small" />
        <app-button (clicked)="paretoComp?.loadABCPareto()"
                    icon="pi pi-refresh" label="Rafraîchir" severity="primary" size="small" />
      </div>
    }
    @if (active() === 'rotation') {
      <div class="flex gap-2">
        <app-button (clicked)="rotationComp?.toggleHelpDrawer()" [outlined]="true"
                    icon="pi pi-question-circle" label="Aide" severity="secondary" size="small" />
        <app-button (clicked)="rotationComp?.onClearFilters()"
                    icon="pi pi-filter-slash" label="Effacer les filtres" severity="secondary"
                    size="small" />
        <app-button (clicked)="rotationComp?.exportToPdf()"
                    icon="pi pi-file-pdf" label="Exporter PDF" severity="danger" size="small" />
        <app-button (clicked)="rotationComp?.loadRotations()"
                    icon="pi pi-refresh" label="Rafraîchir" severity="primary" size="small" />
      </div>
    }
  </ng-container>
</app-toolbar>

<!-- Onglets -->
<div class="pharma-nav-tabs-container">
  <div
    #nav="ngbNav"
    (activeIdChange)="onActiveChange($event)"
    [activeId]="active()"
    class="nav pharma-nav-tabs"
    ngbNav
    orientation="horizontal"
  >
    <ng-container [ngbNavItem]="'pareto'">
      <a class="pharma-nav-tab-link" ngbNavLink>
        <i class="pi pi-sort-amount-down me-1"></i>
        Par chiffre d'affaires (Pareto)
      </a>
      <ng-template ngbNavContent>
        <app-abc-pareto />
      </ng-template>
    </ng-container>

    <ng-container [ngbNavItem]="'rotation'">
      <a class="pharma-nav-tab-link" ngbNavLink>
        <i class="pi pi-sync me-1"></i>
        Par rotation
      </a>
      <ng-template ngbNavContent>
        <app-stock-rotation />
      </ng-template>
    </ng-container>
  </div>

  <div class="pharma-nav-tabs-outlet">
    <div [ngbNavOutlet]="nav"></div>
  </div>
</div>
