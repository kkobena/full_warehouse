@if (loading()) {
  <app-kpi-strip [loading]="true" [skeletonCount]="4" stripClass="mt-1" />
} @else if (kpi()) {
  <app-kpi-strip stripClass="mt-1">
    <app-kpi-item
      [accent]="'primary'"
      [value]="kpi()!.totalFacture | number"
      icon="pi pi-file-edit"
      iconClass="text-primary"
      label="Total facturé"
      info="Montant net des factures du mois affiché, pour tous les organismes du périmètre."
      valueClass="text-primary"
    >
      <ng-container ngProjectAs="[kpiSub]">{{ kpi()!.countFactures | number }}factures
      </ng-container>
    </app-kpi-item>

    <app-kpi-item
      [accent]="'success'"
      [value]="kpi()!.totalRegle | number"
      icon="pi pi-check-circle"
      iconClass="text-success"
      label="Total réglé"
      info="Ce qui a été encaissé sur les factures de ce mois. Le taux rapporte ce réglé au facturé du même mois."
      valueClass="text-success"
    >
      <ng-container ngProjectAs="[kpiSub]">Taux {{ kpi()!.tauxRecouvrement | number: '1.1-1' }}%
      </ng-container>
    </app-kpi-item>

    <app-kpi-item
      [accent]="'danger'"
      [value]="kpi()!.totalRestant | number"
      icon="pi pi-exclamation-circle"
      iconClass="text-danger"
      label="Restant dû"
      info="Facturé du mois moins réglé du mois. Le compteur dessous est celui des factures du mois non soldées, partiellement réglées comprises."
      valueClass="text-danger"
    >
      <ng-container ngProjectAs="[kpiSub]">{{ kpi()!.countImpayees | number }}impayées
      </ng-container>
    </app-kpi-item>

    <app-kpi-item
      [accent]="'warning'"
      [value]="kpi()!.soldeCumule | number"
      icon="pi pi-history"
      iconClass="text-warning"
      label="Solde cumulé"
      info="Reste dû du mois, augmenté du report : tout ce qui restait impayé sur les factures antérieures au 1er du mois affiché, sans limite d'ancienneté."
      valueClass="text-warning"
    >
      <ng-container ngProjectAs="[kpiSub]">Dont report antérieur</ng-container>
    </app-kpi-item>
  </app-kpi-strip>
}
