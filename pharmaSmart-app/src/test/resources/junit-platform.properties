junit.jupiter.execution.timeout.default = 15 s
junit.jupiter.execution.timeout.testable.method.default = 15 s
# Le @BeforeAll des tests d'integration demarre un conteneur PostgreSQL et y rejoue toute la serie
# Flyway. La suite en demarre plusieurs, qui se disputent la machine : 60 s suffisaient a peine sur
# un poste au repos et laissaient tomber la classe la plus lente sous charge. Ce delai borne un
# demarrage d'infrastructure, pas une mesure de performance applicative — le plafond des methodes
# de test, lui, reste a 15 s.
junit.jupiter.execution.timeout.beforeall.method.default = 180 s
junit.jupiter.testclass.order.default=com.kobe.warehouse.config.SpringBootTestClassOrderer
