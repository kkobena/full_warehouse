<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Rapport de Rentabilité</title>
    <style th:replace="~{common/css}"></style>
  </head>
  <body>
    <header th:replace="~{common/commonheader}"></header>
    <div class="invoice">
      <main>
        <!--
          Le chiffre d'affaires flatte, la marge paie. Les deux compteurs de produits — marge
          insuffisante d'un côté, marge confortable de l'autre — sont là pour être lus
          ensemble avec le CA qu'ils représentent : quelques références à faible marge sur un
          gros volume pèsent plus que beaucoup de références marginales.
        -->
        <div class="alert-summary">
          <table class="summary-table">
            <tbody>
              <tr>
                <td class="summary-item">
                  <strong>CA total&nbsp;:</strong>
                  <span
                    th:text="${#numbers.formatInteger(summary.caTotalGlobal ?: 0, 0, 'WHITESPACE')} + ' ' + ${devise}"
                  ></span>
                </td>
                <td class="summary-item">
                  <strong>Marge brute&nbsp;:</strong>
                  <span
                    th:text="${#numbers.formatInteger(summary.margeBruteGlobale ?: 0, 0, 'WHITESPACE')} + ' ' + ${devise}"
                  ></span>
                </td>
                <td class="summary-item">
                  <strong>Taux de marge moyen&nbsp;:</strong>
                  <span
                    th:text="${summary.tauxMargeMoyen != null ? #numbers.formatDecimal(summary.tauxMargeMoyen, 1, 2) : '0,00'} + ' %'"
                  ></span>
                </td>
              </tr>
              <tr>
                <td class="summary-item">
                  <strong>Références analysées&nbsp;:</strong>
                  <span th:text="${summary.totalProduits ?: 0}"></span>
                </td>
                <td class="summary-item alerte">
                  <strong>Marge insuffisante&nbsp;:</strong>
                  <span th:text="${summary.nbProduitsMargeInsuffisante ?: 0}"></span> réf. —
                  <span
                    th:text="${#numbers.formatInteger(summary.caProduitsFaibleMarge ?: 0, 0, 'WHITESPACE')} + ' ' + ${devise}"
                  ></span>
                </td>
                <td class="summary-item">
                  <strong>Bonne marge&nbsp;:</strong>
                  <span th:text="${summary.nbProduitsMargeConfortable ?: 0}"></span> réf. —
                  <span
                    th:text="${#numbers.formatInteger(summary.caProduitsBonneMarge ?: 0, 0, 'WHITESPACE')} + ' ' + ${devise}"
                  ></span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <table class="main-table">
          <thead>
            <tr>
              <th>Produit</th>
              <th>Code CIP</th>
              <th>Catégorie</th>
              <th class="text-right">Nb ventes</th>
              <th class="text-right">Qté vendue</th>
              <th class="text-right">CA total</th>
              <th class="text-right">Coût d'achat</th>
              <th class="text-right">Marge brute</th>
              <th class="text-right">Taux marge</th>
              <th class="text-right">Rotation / an</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="m : ${marges}">
              <td th:text="${m.libelle}"></td>
              <td th:text="${m.codeCip}"></td>
              <td th:text="${m.categorie}"></td>
              <td class="text-right" th:text="${m.nbVentes}"></td>
              <td class="text-right" th:text="${m.qteVendue}"></td>
              <td class="text-right" th:text="${#numbers.formatInteger(m.caTotal ?: 0, 0, 'WHITESPACE')}"></td>
              <td class="text-right" th:text="${#numbers.formatInteger(m.coutAchatTotal ?: 0, 0, 'WHITESPACE')}"></td>
              <td class="text-right" th:text="${#numbers.formatInteger(m.margeBrute ?: 0, 0, 'WHITESPACE')}"></td>
              <td
                class="text-right"
                th:text="${m.tauxMargePct != null ? #numbers.formatDecimal(m.tauxMargePct, 1, 2) : '0,00'} + ' %'"
              ></td>
              <td
                class="text-right"
                th:text="${m.tauxRotationAnnuel != null ? #numbers.formatDecimal(m.tauxRotationAnnuel, 1, 2) : '0,00'}"
              ></td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="5" class="text-right"><strong>Total</strong></td>
              <td class="text-right">
                <strong th:text="${#numbers.formatInteger(summary.caTotalGlobal ?: 0, 0, 'WHITESPACE')}"></strong>
              </td>
              <td class="text-right">
                <strong th:text="${#numbers.formatInteger(summary.coutAchatGlobal ?: 0, 0, 'WHITESPACE')}"></strong>
              </td>
              <td class="text-right">
                <strong th:text="${#numbers.formatInteger(summary.margeBruteGlobale ?: 0, 0, 'WHITESPACE')}"></strong>
              </td>
              <td class="text-right">
                <strong
                  th:text="${summary.tauxMargeMoyen != null ? #numbers.formatDecimal(summary.tauxMargeMoyen, 1, 2) : '0,00'} + ' %'"
                ></strong>
              </td>
              <td class="text-right"><strong th:text="${marges.size()} + ' réf.'"></strong></td>
            </tr>
          </tfoot>
        </table>
      </main>
    </div>
  </body>
</html>
