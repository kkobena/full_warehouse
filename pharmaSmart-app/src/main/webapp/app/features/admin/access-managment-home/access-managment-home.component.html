
  <app-nav-sidebar (collapsedChange)="menuReplie.set($event)" [collapsed]="menuReplie()"
                   [collapsible]="true" [nav]="nav" contentColumnClass="col-xl-10 col-lg-10 col-md-9 col-sm-8"
                   icon="pi pi-shield" menuColumnClass="col-lg-2 col-xl-2 col-xxl-2 col-md-3 col-sm-4"
                   title="Rôles &amp; Autorisations">
    <div #nav="ngbNav" [activeId]="active()" (activeIdChange)="active.set($any($event))"
         class="nav flex-column nav-pills" ngbNav orientation="vertical">
      <ng-container ngbNavItem="roles">        <a class="pharma-nav-vertical-link" ngbNavLink>
          <app-nav-section-link code="access-management.roles"
                                fallbackIcon="pi pi-users"
                                fallbackLabel="Rôles" />
        </a>
        <ng-template ngbNavContent>
          <app-role navCode="access-management.roles" (managePermissions)="openPermissions($event)" />
        </ng-template>
      </ng-container>

      <ng-container ngbNavItem="autorisations" [destroyOnHide]="false">
        <a class="pharma-nav-vertical-link" ngbNavLink>
          <app-nav-section-link code="access-management.autorisations"
                                fallbackIcon="pi pi-lock"
                                fallbackLabel="Autorisations" />
        </a>
        <ng-template ngbNavContent>
          <app-nav-manager [triggerRole]="pendingRole()" />
        </ng-template>
      </ng-container>
    </div>
  </app-nav-sidebar>
