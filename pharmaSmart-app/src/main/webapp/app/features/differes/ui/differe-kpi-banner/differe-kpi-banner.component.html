@if (summary()) {
  <app-kpi-strip stripClass="mt-1">
    <app-kpi-item
      [accent]="'primary'"
      [value]="summary().saleAmount | number"
      icon="pi pi-credit-card"
      iconClass="text-primary"
      label="Total différé"
      info="Montant des ventes à crédit encore non soldées — du client filtré, ou de tous les clients à défaut de filtre. Une vente entièrement réglée n'y figure plus."
      [suffix]="'' | devise"
      valueClass="text-primary"
    />

    <app-kpi-item
      [accent]="'success'"
      [value]="summary().paidAmount | number"
      icon="pi pi-check-circle"
      iconClass="text-success"
      label="Total payé"
      info="Ce qui a déjà été remboursé sur ces mêmes ventes."
      [suffix]="'' | devise"
      valueClass="text-success"
    />

    <app-kpi-item
      [accent]="'danger'"
      [value]="summary().rest | number"
      icon="pi pi-exclamation-circle"
      iconClass="text-danger"
      label="Reste à payer"
      info="Encours à recouvrer : le reste dû porté par chaque vente. Il peut s'écarter du total différé moins le total payé, ces deux montants n'ayant pas la même assiette."
      [suffix]="'' | devise"
      valueClass="text-danger"
    />
  </app-kpi-strip>
}
